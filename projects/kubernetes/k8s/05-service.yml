# ============================================================
#  SERVICE
# ============================================================
# A Service gives pods a stable virtual IP (ClusterIP) and DNS name.
# Without a Service, pods get random IPs that change on restart.
#
# kube-proxy on every node maintains iptables/IPVS rules so that
# traffic to the Service VIP is load-balanced to healthy pod IPs.
#
# Service types:
#   ClusterIP      — VIP reachable only inside the cluster (default)
#   NodePort       — also opens a static port on EVERY node (30000-32767)
#   LoadBalancer   — provisions a cloud LB (AWS ELB, GCP LB, Azure LB)
#   ExternalName   — CNAME alias to an external DNS name (no proxy)
#   Headless       — ClusterIP: None → returns pod IPs directly (StatefulSets)
#
# DNS: <service-name>.<namespace>.svc.cluster.local
#      demo-service.k8s-demo.svc.cluster.local
# ============================================================

# ── ClusterIP Service (internal traffic only) ───────────────
apiVersion: v1
kind: Service
metadata:
  name: demo-service
  namespace: k8s-demo
  labels:
    app: k8s-demo
spec:
  type: ClusterIP
  # Selector matches pods with label app=k8s-demo.
  # Service continuously watches pod health via Endpoints object.
  # Only READY pods (passing readinessProbe) receive traffic.
  selector:
    app: k8s-demo
  ports:
    - name: http
      protocol: TCP
      port: 80          # port exposed by the Service (what clients call)
      targetPort: 8080  # port on the Pod/container

---
# ── NodePort Service (external access without a cloud LB) ────
# Useful for local development with Minikube or Kind.
# Access: http://<any-node-IP>:30080
apiVersion: v1
kind: Service
metadata:
  name: demo-service-nodeport
  namespace: k8s-demo
  labels:
    app: k8s-demo
spec:
  type: NodePort
  selector:
    app: k8s-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080   # Static port on every node (must be 30000-32767)

---
# ── Headless Service (for StatefulSets / direct pod DNS) ─────
# With ClusterIP: None, kube-dns returns individual pod IPs.
# Used by StatefulSets so each pod gets a stable DNS:
#   demo-0.demo-headless.k8s-demo.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: demo-headless
  namespace: k8s-demo
  labels:
    app: k8s-demo
spec:
  clusterIP: None       # This is what makes it headless
  selector:
    app: k8s-demo-stateful
  ports:
    - name: http
      port: 8080
      targetPort: 8080
