# ============================================================
#  DAEMON SET
# ============================================================
# DaemonSet ensures ONE pod runs on EVERY node in the cluster
# (or a subset of nodes via nodeSelector / tolerations).
#
# When a new node joins, the DaemonSet controller automatically
# schedules the pod on it. When a node is removed, the pod is
# garbage-collected.
#
# Use cases:
#   - Log collectors:    Fluentd, Filebeat, Promtail
#   - Monitoring agents: Datadog Agent, Prometheus node-exporter
#   - Network plugins:   Calico, Cilium, Flannel (CNI plugins run as DaemonSets)
#   - Storage drivers:   Ceph, Portworx
#   - Security scanners: Falco, Sysdig Agent
#
# kube-proxy itself is a DaemonSet in most cluster setups!
# ============================================================

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: demo-log-collector
  namespace: k8s-demo
  labels:
    app: demo-log-collector
spec:
  selector:
    matchLabels:
      app: demo-log-collector

  updateStrategy:
    type: RollingUpdate           # Alternative: OnDelete (manual pod deletion)
    rollingUpdate:
      maxUnavailable: 1           # Update 1 node at a time

  template:
    metadata:
      labels:
        app: demo-log-collector
    spec:
      # ── Tolerations ──────────────────────────────────────────
      # Control-plane nodes are tainted NoSchedule by default.
      # Add toleration to run on control-plane nodes too (rare but possible).
      tolerations:
        - key:    node-role.kubernetes.io/control-plane
          effect: NoSchedule

      containers:
        - name: log-collector
          # Simulating a log collector (Fluentd/Filebeat would go here)
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Log collector started on node $NODE_NAME"
              while true; do
                echo "$(date) - Collecting logs from node $NODE_NAME"
                sleep 30
              done

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          # ── Host path mounts — DaemonSets often need node-level access
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true

          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "100m"
              memory: "128Mi"

      volumes:
        - name: varlog
          hostPath:
            path: /var/log

        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers

      # Run with elevated permissions if needed for log access
      # (avoid in production, use PSP/OPA/Kyverno to restrict)
      # securityContext:
      #   runAsUser: 0
