# ============================================================
#  DEPLOYMENT
# ============================================================
# A Deployment is the most common way to run stateless workloads.
# It manages a ReplicaSet, which in turn manages Pods.
#
# Hierarchy:
#   Deployment → ReplicaSet → Pod(s) → Container(s)
#
# The Deployment Controller (part of kube-controller-manager) watches
# the cluster state and reconciles it toward the desired state declared
# here. If a Pod dies, the ReplicaSet controller creates a replacement.
#
# Deployment gives you:
#   - Declarative rollouts (RollingUpdate / Recreate strategies)
#   - Automatic rollback on failure
#   - Pause / resume rollouts
#   - Scaling (manual + HPA)
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-demo-deployment
  namespace: k8s-demo
  labels:
    app: k8s-demo
    version: "1.0.0"
  annotations:
    # Annotations are non-identifying metadata (larger, non-queryable)
    # Used by tooling, CI/CD, operators. Not used by k8s selectors.
    deployment.kubernetes.io/revision: "1"
    description: "Hands-on Kubernetes learning deployment"

spec:
  # ── Desired number of Pod replicas ──────────────────────────
  # The ReplicaSet will always maintain exactly this many healthy pods.
  replicas: 2

  # ── Selector ────────────────────────────────────────────────
  # Tells the Deployment which Pods it "owns" via label matching.
  # Must match spec.template.metadata.labels exactly.
  selector:
    matchLabels:
      app: k8s-demo

  # ── Rollout strategy ────────────────────────────────────────
  strategy:
    type: RollingUpdate     # Alternative: Recreate (kills all old pods first)
    rollingUpdate:
      maxSurge: 1           # How many extra pods can exist during rollout
      maxUnavailable: 0     # How many pods can be unavailable during rollout
                            # maxUnavailable=0 means zero-downtime deployment

  # ── How many old ReplicaSets to keep for rollback ───────────
  revisionHistoryLimit: 5

  # ── Pod Template ────────────────────────────────────────────
  # Everything under here is the spec for EACH Pod that gets created.
  template:
    metadata:
      labels:
        app: k8s-demo         # Must match selector.matchLabels
        version: "1.0.0"
      annotations:
        # Prometheus scraping annotations (if using annotation-based discovery)
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8080"
        prometheus.io/path:   "/actuator/prometheus"

    spec:
      # ── Graceful shutdown ────────────────────────────────────
      # Kubernetes sends SIGTERM then waits terminationGracePeriodSeconds
      # before sending SIGKILL. Spring Boot's graceful shutdown handles SIGTERM.
      terminationGracePeriodSeconds: 60

      # ── Service Account ──────────────────────────────────────
      # Pods use a ServiceAccount to call the Kubernetes API.
      # Default SA has minimal permissions.
      serviceAccountName: default

      # ── Init Containers ─────────────────────────────────────
      # Run to completion BEFORE the main container starts.
      # Useful for: DB migrations, downloading configs, waiting for deps.
      initContainers:
        - name: init-wait
          image: busybox:1.36
          # In a real app you'd wait for a DB to be ready, e.g.:
          # command: ['sh', '-c', 'until nc -z db-service 5432; do sleep 2; done']
          command: ['sh', '-c', 'echo "Init container ran at $(date)" && sleep 1']

      # ── Main Containers ─────────────────────────────────────
      containers:
        - name: k8s-demo
          # In production: use a specific digest, not 'latest'
          # e.g., k8s-demo:1.0.0@sha256:abc123...
          image: k8s-demo:1.0.0
          imagePullPolicy: IfNotPresent   # Never pull if image exists locally

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ── Environment Variables ──────────────────────────
          env:
            # Downward API — exposes pod metadata as env vars
            # The kubelet populates these from the pod spec at runtime.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            # From ConfigMap — individual key reference
            - name: APP_GREETING
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key:  APP_GREETING

            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key:  APP_VERSION

            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key:  APP_ENV

            # From Secret — value is base64-decoded before injection
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-secret
                  key:  DB_PASSWORD

            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: demo-secret
                  key:  API_KEY

          # ── Volume Mounts ──────────────────────────────────
          volumeMounts:
            # Mount ConfigMap as a config file
            - name: config-volume
              mountPath: /config
              readOnly: true

            # Mount PersistentVolume for durable storage demo
            - name: data-volume
              mountPath: /data

          # ── Resource Requests & Limits ─────────────────────
          # requests: guaranteed minimum (used by scheduler for placement)
          # limits:   hard cap (container is killed/throttled if exceeded)
          #
          # CPU:    1000m = 1 core. 250m = 0.25 core.
          # Memory: Ki/Mi/Gi = kibibytes/mebibytes/gibibytes
          resources:
            requests:
              cpu:    "250m"
              memory: "256Mi"
            limits:
              cpu:    "500m"
              memory: "512Mi"

          # ── Liveness Probe ─────────────────────────────────
          # kubelet calls this endpoint periodically.
          # FAIL → container is RESTARTED (auto-heal).
          # Use for: detecting deadlocks, infinite loops.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30   # wait before first probe (app startup time)
            periodSeconds:       15   # probe every 15s
            failureThreshold:    3    # restart after 3 consecutive failures
            timeoutSeconds:      5

          # ── Readiness Probe ────────────────────────────────
          # FAIL → pod is removed from Service endpoints (no traffic).
          # NOT restarted. Use for: warming up caches, waiting for deps.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds:       10
            failureThreshold:    3
            timeoutSeconds:      5

          # ── Startup Probe ──────────────────────────────────
          # Disables liveness/readiness until app passes this.
          # Prevents premature restarts of slow-starting apps.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds:       5
            failureThreshold:    12   # allow up to 60s for startup

      # ── Volumes ────────────────────────────────────────────
      volumes:
        # ConfigMap as a volume — each key becomes a file
        - name: config-volume
          configMap:
            name: demo-config
            items:
              - key:  app.properties
                path: app.properties

        # PVC-backed persistent volume
        - name: data-volume
          persistentVolumeClaim:
            claimName: demo-pvc

      # ── Pod Scheduling Controls ────────────────────────────
      # Spread pods across nodes for resilience (Anti-Affinity)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: k8s-demo
                topologyKey: kubernetes.io/hostname
                # Prefer to schedule on different nodes (hostname = each node)

      # ── Tolerations ───────────────────────────────────────
      # Allow this pod to be scheduled on tainted nodes.
      # Example: nodes tainted with 'special-hardware=true:NoSchedule'
      # tolerations:
      #   - key: "special-hardware"
      #     operator: "Equal"
      #     value: "true"
      #     effect: "NoSchedule"
