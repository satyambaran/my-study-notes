# ============================================================
#  SECRET
# ============================================================
# Secrets store sensitive data (passwords, tokens, TLS certs).
# Values are base64-encoded — NOT encrypted by default.
#
# To truly encrypt secrets at rest:
#   - Enable EncryptionConfiguration on the API server (kube-system)
#   - Or use an external KMS (AWS KMS, HashiCorp Vault, Sealed Secrets)
#
# Secret types:
#   Opaque              — arbitrary key-value data (most common)
#   kubernetes.io/tls   — TLS certificate + private key
#   kubernetes.io/dockerconfigjson — image pull credential
#   kubernetes.io/service-account-token
#
# How to base64 encode:
#   echo -n 'my-password' | base64
#   echo -n 'bXktcGFzc3dvcmQ='  | base64 -d   (decode)
#
# NEVER commit real secrets to git. Use:
#   - Sealed Secrets (Bitnami)
#   - External Secrets Operator
#   - HashiCorp Vault Agent Injector
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
  namespace: k8s-demo
  labels:
    app: k8s-demo
type: Opaque
data:
  # base64("supersecretpassword")
  DB_PASSWORD: c3VwZXJzZWNyZXRwYXNzd29yZA==
  # base64("my-api-key-12345")
  API_KEY: bXktYXBpLWtleS0xMjM0NQ==

---
