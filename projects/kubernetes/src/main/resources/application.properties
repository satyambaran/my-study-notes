# Server
server.port=8080

# Spring Actuator — expose health, info, prometheus for Kubernetes probes + HPA
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Actuator info endpoint — shows in kubectl describe / dashboards
info.app.name=k8s-java-demo
info.app.version=1.0.0
info.app.description=Hands-on Kubernetes learning app

# Graceful shutdown — lets in-flight requests complete before pod terminates
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
