<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto PiP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 240px;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    .header {
      background: linear-gradient(135deg, #16213e, #0f3460);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      font-size: 24px;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      color: #e94560;
    }

    .header-subtitle {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .content {
      padding: 16px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #16213e;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 500;
    }

    .toggle-desc {
      font-size: 11px;
      color: #888;
      margin-top: 3px;
    }

    /* Toggle switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #444;
      transition: 0.3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #e94560;
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .status-badge {
      text-align: center;
      font-size: 12px;
      padding: 6px;
      border-radius: 6px;
      margin-bottom: 12px;
      background: #0f3460;
      color: #53d8fb;
    }

    .status-badge.off {
      background: #2a1a1a;
      color: #888;
    }

    .footer {
      font-size: 10px;
      text-align: center;
      color: #555;
      padding-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">▶</div>
    <div>
      <div class="header-title">Auto PiP</div>
      <div class="header-subtitle">Picture-in-Picture on tab switch</div>
    </div>
  </div>

  <div class="content">
    <div id="statusBadge" class="status-badge">Auto-PiP is ON</div>

    <div class="toggle-row">
      <div>
        <div class="toggle-label">Enable Auto-PiP</div>
        <div class="toggle-desc">Activates when you switch tabs</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="togglePip" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="footer">Works on YouTube, Netflix, Twitch &amp; more</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
