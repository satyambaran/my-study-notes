# ── Deployment ──────────────────────────────────────────────────────────────
# imagePullPolicy: Never tells Kubernetes to use the locally built image
# (built inside Minikube's Docker daemon by deploy.sh) instead of pulling
# from a remote registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urlshortener-app
  namespace: urlshortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: urlshortener-app
  template:
    metadata:
      labels:
        app: urlshortener-app
    spec:
      containers:
        - name: app
          image: urlshortener:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: urlshortener-secrets
                  key: DB_URL
            - name: REDIS_URL
              value: "redis-service:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urlshortener-secrets
                  key: REDIS_PASSWORD
            # BASE_URL is patched by deploy.sh after the service NodePort is known.
            # It must end with a trailing slash.
            - name: BASE_URL
              value: ""
          # Resource requests tell the scheduler how much CPU/memory to reserve.
          # Limits cap what the container can use.
          # The HPA uses CPU requests as the baseline for its percentage calculations.
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

---
# ── Service ──────────────────────────────────────────────────────────────────
# NodePort exposes the app outside the cluster.
# Fixed nodePort 30300 so deploy.sh can construct BASE_URL before the first request.
apiVersion: v1
kind: Service
metadata:
  name: urlshortener-service
  namespace: urlshortener
spec:
  type: NodePort
  selector:
    app: urlshortener-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300

---
# ── HorizontalPodAutoscaler ───────────────────────────────────────────────────
# Watches average CPU across all app pods.
# If it exceeds 50% of the requested 100m (i.e. >50m per pod on average),
# Kubernetes spawns more pods — up to 10.
# Requires metrics-server to be running (enabled by deploy.sh).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: urlshortener-hpa
  namespace: urlshortener
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: urlshortener-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
