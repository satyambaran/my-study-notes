# stringData lets you write plain text; Kubernetes base64-encodes it at apply time.
# In a real environment use 'kubectl create secret' or a secrets manager instead.
apiVersion: v1
kind: Secret
metadata:
  name: urlshortener-secrets
  namespace: urlshortener
type: Opaque
stringData:
  POSTGRES_PASSWORD: "password"
  REDIS_PASSWORD: "password"
  DB_URL: "postgresql://postgres:password@postgres-service:5432/db"
