services:
    db:
        image: postgres:14-alpine
        container_name: db
        ports:
            - "${POSTGRES_PORT}:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:latest
        container_name: redis
        ports:
            - "${REDIS_PORT}:6379"
        volumes:
            - redis-data:/data
        command: redis-server --requirepass ${REDIS_PASSWORD}
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    app:
        build: .
        container_name: app
        ports:
            - "3000:3000"
        environment:
            # Inside the compose network, services are reached by their service name.
            # These override whatever is in the .env file (which uses localhost for local dev).
            - DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            - REDIS_URL=redis:6379
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

volumes:
    redis-data:
        driver: local
