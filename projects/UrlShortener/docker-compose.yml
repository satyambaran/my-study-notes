services:
    db:
        image: postgres:14-alpine
        container_name: db
        ports:
            - "${POSTGRES_PORT}:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
    redis:
        image: redis:latest
        container_name: redis
        ports:
            - "${REDIS_PORT}:6379"
        volumes:
            - redis-data:/data
        command: redis-server --requirepass ${REDIS_PASSWORD}

volumes:
    redis-data:
        driver: local